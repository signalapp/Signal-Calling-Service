[package]
name = "calling_backend"
version.workspace = true
authors = ["Calling Team <callingteam@signal.org>"]
edition = "2024"
description = "Media forwarding server for group calls."
license = "AGPL-3.0-only"

[dependencies]
mrp = { git = "https://github.com/signalapp/ringrtc", tag = "v2.70.2" }
calling_common = { path = "../common" }
metrics = { path = "../metrics" }

# For small, inline collections
smallvec = "1.15.1"

# For error handling
anyhow = "1.0.104"
thiserror = "2.0.17"

# For logging and command line operations
log = "0.4.29"
env_logger = "0.11.8"
clap = { version = "4.5.53", features = ["derive"] }

# For runtime and threading
tokio = { version = "1.48.0", features = ["full"] }
parking_lot = {  version = "0.12.5", features = ["deadlock_detection"] }
once_cell = "1.21.3"
futures = "0.3.31"
core_affinity = "0.8.3"
async-trait = "0.1.89"

# For http
axum = { version = "0.7.9" }
axum-extra = { version = "0.9.6", default-features = false, features = ["typed-header", "tracing"] }
hyper = { version = "1.8.1", features = ["full"] }
reqwest = { version = "0.12.26", default-features = false, features = ["json"] }
tower = "0.5.2"

# For general conversions
byteorder = "1.5.0"
hex = { version = "0.4.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_with = { version = "3.16.1", features = ["base64"] }
prost = "0.14.1"
strum = "0.26.3"
strum_macros = "0.26.4"

# For common
sha2 = { workspace = true }

# For SVC frame tracker
num-traits = "0.2.19"

# For ICE
crc = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }

# For SRTP key derivation using DHE
hkdf = { workspace = true }
rand = { workspace = true}
x25519-dalek = { workspace = true }

# For (S)RTP
aes = "0.9.2"
aes-gcm = "0.11.0"
zeroize = "1.8.2"

# For low-level UDP sockets and tracking TCP sockets
nix = { version = "0.27.1", optional = true, features = ["time", "socket", "event", "signal", "net"] }
unique_id = "0.1.7"

# For current process memory stats
psutil = { version = "3.3.0", default-features = false, features = ["cpu", "process"] }
rlimit = "0.10.2"

# For TLS sockets in epoll backend
rustls = "0.23.35"

# For endorsements
libsignal-core = { workspace = true }
zkgroup = { workspace = true }
bincode = { workspace = true }
itertools = "0.15.0"
base64 = "0.22.1"

# For rate limiting
governor = "0.10.2"
nonzero_ext = "0.3.0"

[target.'cfg(target_os="linux")'.dependencies]
# Only currently needed for metrics (won't build on mac, see https://github.com/rust-lang/rust/issues/115149).
accounting-allocator = "0.2.0"

[build-dependencies]
prost-build = "0.14.1"

[dev-dependencies]
http = "1.4.0"
hex-literal = "0.4.1"

tokio = { version = "1.48.0", features = ["test-util"] }

# For matching WebRTC's randomness
rand_distr = "0.6.0"

[features]
default = ["epoll"]
epoll = ["nix"]
load_test = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
